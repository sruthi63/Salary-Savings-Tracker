<!DOCTYPE html>
<html><head><title>Add Expense</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container mt-5">
<div class="card p-4 shadow"><h3>💸 Add Expense - Salary Vachaka</h3>
<form method="POST">{% csrf_token %}
<label>Select Salary Month</label>
<select name="salary" class="form-control mb-3" required>
{% for s in salaries %}<option value="{{s.id}}">{{s.month}} - ₹{{s.amount}}</option>{% endfor %}
</select>

<label>Expense Type</label>
<select name="category" class="form-control mb-3" required>
<option value="House Rent">🏠 House Rent</option>
<option value="Mobile Recharge">📱 Mobile Recharge</option>
<option value="Food">🍔 Food</option>
<option value="Shopping">🛍️ Shopping</option>
<option value="Medicals">💊 Medicals</option>
<option value="Movie">🎬 Movie</option>
<option value="Trip">✈️ Trip / Travel</option>
<option value="Electricity Bill">💡 Electricity Bill</option>
<option value="Transport">🚌 Transport</option>
<option value="Other">Other</option>
</select>

<input type="text" name="description" placeholder="Eg: Airtel Recharge, D-Mart, Apollo Medicals" class="form-control mb-3" required>
<input type="number" name="amount" placeholder="Amount - Eg: 500" class="form-control mb-3" required>
<button class="btn btn-warning w-100">Add Expense ✅</button>
<a href="/" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
</form></div></div></body></html>
