<!DOCTYPE html>
<html><head><title>Add Salary</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container mt-5">
<div class="card p-4"><h3>Add Salary</h3>
<form method="POST">{% csrf_token %}
<input type="text" name="month" placeholder="Eg: Jan 2026" class="form-control mb-3" required>
<input type="number" name="amount" placeholder="Salary Amount" class="form-control mb-3" required>
<button class="btn btn-primary">Save</button>
<a href="/" class="btn btn-secondary">Back</a>
</form></div></div></body></html>
